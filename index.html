<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praetoria</title>
    <base href="/Praetoria-/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
    <div id="app">
        <div class="boot">
            <div class="boot-mark">✦</div>
            <div class="boot-title">PRAETORIA</div>
            <div class="boot-sub">waking the engine…</div>
        </div>
    </div>
    <div id="blazor-error-ui">
        Something broke. <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
      // settings kept in this browser (docs/WEB_CLIENT.md, "Settings"): read once here so the title screen is already at the chosen size
      window.praetoriaSettings = (() => {
        const KEY = 'praetoria.settings', SIZES = { small: '13.5px', normal: '15px', large: '16.5px', larger: '18px' };
        const read = () => { try { return Object.assign({ text: 'normal', enterEnds: true, numberKeys: true }, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch { return { text: 'normal', enterEnds: true, numberKeys: true }; } };
        const apply = (s) => { document.documentElement.style.fontSize = SIZES[s.text] || SIZES.normal; };
        apply(read());
        return { get: () => JSON.stringify(read()), set: (k, v) => { const s = read(); s[k] = v; try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} apply(s); return JSON.stringify(s); } };
      })();
      window.praetoria = {
        save: (k, v) => { const t = performance.now(); try { localStorage.setItem(k, v); return true; } catch { return false; } finally { const d = performance.now() - t; if (d > 30 && location.search.includes('perf')) console.log('PERF localStorage.setItem ' + Math.round(d) + ' ms for ' + v.length + ' chars'); } },
        load: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
        has: (k) => { try { return localStorage.getItem(k) ? '1' : ''; } catch { return ''; } },
        remove: (k) => { try { localStorage.removeItem(k); } catch {} },
        download: (name, text) => {
          const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: 'application/json'}));
          a.download = name; a.click(); URL.revokeObjectURL(a.href);
        },
        scrollTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
        size: (el) => { const r = el.getBoundingClientRect(); return [r.width, r.height]; },
        ready: (name) => new Promise(res => { let n = 0; const t = setInterval(() => { if (window[name] || ++n > 200) { clearInterval(t); res(!!window[name]); } }, 50); }),
        keys: (ref) => { window.addEventListener('keydown', e => { if (e.target && ['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return; if (e.ctrlKey || e.metaKey || e.altKey) return; if (e.key === 'Enter' || e.key === 'Escape' || e.key === '?' || /^[0-9=-]$/.test(e.key)) ref.invokeMethodAsync('Key', e.key); }); }
      };
    </script>
    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
    <script type="module" src="js/space.js"></script>
    <script type="module" src="js/office.js"></script>
    <script type="module" src="js/portrait.js"></script>
    <script type="module" src="js/sets.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/tips.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
