name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build · Validate · Test (headless Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Only the headless solution — Core/Tools/Tests. The Godot /src/Game project is
      # intentionally excluded (BuildSpec Milestone-1 rule: the core builds without Godot).
      - name: Restore
        run: dotnet restore Praetoria.sln

      - name: Build
        run: dotnet build Praetoria.sln --no-restore -c Release

      - name: Validate content (engine gate)
        run: dotnet run --project src/Tools -c Release --no-build -- validate

      # The stricter pre-flight: locked vocabularies, read-only counters, flag-chain audit, ungated-choice rule.
      - name: Validate content (pre-flight)
        run: python3 validate_praetoria.py

      - name: Test
        run: dotnet test Praetoria.sln --no-build -c Release --verbosity normal

      # The Godot presentation layer compiles against the Godot.NET.Sdk NuGet package without an editor,
      # so CI keeps it building; it cannot run it (no display, no Godot runtime).
      - name: Build Godot layer (compile check)
        run: dotnet build src/Game/Praetoria.Game.csproj -c Release

      # The browser client (Blazor WebAssembly over the same Core) — the one-click build GitHub Pages serves.
      - name: Build web client
        run: dotnet publish src/Web/Praetoria.Web.csproj -c Release -o /tmp/web-out
