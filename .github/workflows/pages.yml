name: Play (GitHub Pages)

# Publishes the browser client (src/Web, Blazor WebAssembly over the headless Core) on every push to main by pushing
# the built site to the `gh-pages` branch, which GitHub Pages serves. The live game is the README's first link.
# If the link ever 404s, Pages needs enabling once: Settings → Pages → Source "Deploy from a branch" → gh-pages / (root).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish the web client
        run: dotnet publish src/Web/Praetoria.Web.csproj -c Release -o out
      - name: Rebase for project pages
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' out/wwwroot/index.html
          cp out/wwwroot/index.html out/wwwroot/404.html
          touch out/wwwroot/.nojekyll
      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out/wwwroot
          force_orphan: true
          commit_message: "Publish web client from ${{ github.sha }}"
