name: Play (GitHub Pages)

# Publishes the browser client (src/Web, Blazor WebAssembly over the headless Core) to GitHub Pages on every push to
# main. The live game is the README's first link. Pages must be set to "GitHub Actions" as its source; the
# configure-pages step turns that on the first time it runs.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish the web client
        run: dotnet publish src/Web/Praetoria.Web.csproj -c Release -o out
      - name: Rebase for project pages
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' out/wwwroot/index.html
          cp out/wwwroot/index.html out/wwwroot/404.html
          touch out/wwwroot/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
